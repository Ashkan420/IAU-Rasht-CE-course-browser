<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جستجوی دروس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#courseTable" class="skip-link">رفتن به جدول دروس</a>
  <div class="container">
    <!-- Header -->
    <header class="header glass">
      <div class="header-top">
        <div class="header-right">
          <!-- Mode Switcher -->
          <nav class="mode-switch" role="tablist" aria-label="حالت نمایش">
            <button class="mode-tab active" data-mode="browser" role="tab" aria-selected="true">جستجوی دروس</button>
            <button class="mode-tab" data-mode="schedule" role="tab" aria-selected="false">برنامه ساز</button>
          </nav>
        </div>
        <div class="header-actions">
          <select class="semester-select" id="semesterSelect"></select>
          <button class="theme-toggle" id="themeToggle" title="تغییر تم">☀️</button>
          <span class="update-date" id="updateDate"></span>
          <button class="btn btn-export" id="btnPdf" title="دانلود PDF">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            PDF
          </button>
          <button class="btn btn-export" id="btnXlsx" title="دانلود XLSX">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>
            XLSX
          </button>
        </div>
      </div>
    </header>

    <!-- Category + Gender Filter (shared glass container) -->
    <div class="filter-bar glass" id="filterBar">
      <div class="category-filter" role="group" aria-label="دسته‌بندی دروس">
        <button class="cat-btn" data-cat="عمومی">عمومی</button>
        <button class="cat-btn" data-cat="تخصصی">تخصصی</button>
        <button class="cat-btn active" data-cat="همه">همه</button>
      </div>
      <div class="gender-filter" id="genderFilter" role="group" aria-label="جنسیت">
        <button class="cat-btn" data-gender="خواهران">خواهران</button>
        <button class="cat-btn" data-gender="برادران">برادران</button>
        <button class="cat-btn active" data-gender="همه">همه</button>
      </div>
    </div>

    <!-- Search Area -->
    <div class="search-area glass">
      <div class="search-fields">
        <div class="search-field">
          <label for="searchCode">کد درس</label>
          <div class="input-group">
            <input type="text" id="searchCode" placeholder="جستجو..." data-field="کد درس">
            <button class="btn-add" data-field="کد درس" title="افزودن فیلتر">+</button>
          </div>
        </div>
        <div class="search-field">
          <label for="searchName">نام درس</label>
          <div class="input-group">
            <input type="text" id="searchName" placeholder="جستجو..." data-field="نام درس">
            <button class="btn-add" data-field="نام درس" title="افزودن فیلتر">+</button>
          </div>
        </div>
        <div class="search-field">
          <label for="searchOffer">کد ارائه</label>
          <div class="input-group">
            <input type="text" id="searchOffer" placeholder="جستجو..." data-field="کد ارائه">
            <button class="btn-add" data-field="کد ارائه" title="افزودن فیلتر">+</button>
          </div>
        </div>
        <div class="search-field">
          <label for="searchInstructor">نام استاد</label>
          <div class="input-group">
            <input type="text" id="searchInstructor" placeholder="جستجو..." data-field="نام استاد">
            <button class="btn-add" data-field="نام استاد" title="افزودن فیلتر">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Active Filters -->
    <div class="active-filters" id="activeFilters"></div>

    <!-- Results Bar -->
    <div class="results-bar">
      <span class="results-count" id="resultsCount"></span>
      <button class="btn btn-clear" id="btnClear" style="display:none">پاک کردن فیلترها</button>
    </div>

    <!-- Error Banner -->
    <div class="error-banner" id="errorBanner">
      <span class="error-banner-text" id="errorBannerText"></span>
      <button class="error-banner-close" id="errorBannerClose">&times;</button>
    </div>

    <!-- ═══ Browser Mode ═══ -->
    <div id="browserMode" class="browser-mode">
      <div class="table-wrapper glass" dir="rtl">
        <!-- Skeleton Loading -->
        <div class="skeleton-wrapper visible" id="skeletonWrapper">
          <svg width="100%" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMin slice">
            <defs>
              <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="rgba(255,255,255,0)" />
                <stop offset="50%" stop-color="rgba(255,255,255,0.04)" />
                <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                <animateTransform attributeName="gradientTransform" type="translate"
                  values="-1 0; 1 0" dur="1.5s" repeatCount="indefinite" />
              </linearGradient>
            </defs>
            <rect x="20" y="16" width="70" height="14" rx="4" fill="rgba(255,255,255,0.06)" />
            <rect x="110" y="16" width="130" height="14" rx="4" fill="rgba(255,255,255,0.06)" />
            <rect x="260" y="16" width="90" height="14" rx="4" fill="rgba(255,255,255,0.06)" />
            <rect x="370" y="16" width="65" height="14" rx="4" fill="rgba(255,255,255,0.06)" />
            <rect x="455" y="16" width="110" height="14" rx="4" fill="rgba(255,255,255,0.06)" />
            <rect x="585" y="16" width="55" height="14" rx="4" fill="rgba(255,255,255,0.06)" />
            <rect x="660" y="16" width="75" height="14" rx="4" fill="rgba(255,255,255,0.06)" />
            <rect x="755" y="16" width="140" height="14" rx="4" fill="rgba(255,255,255,0.06)" />
            <rect x="915" y="16" width="80" height="14" rx="4" fill="rgba(255,255,255,0.06)" />
            <rect x="1015" y="16" width="60" height="14" rx="4" fill="rgba(255,255,255,0.06)" />
            <rect x="1095" y="16" width="90" height="14" rx="4" fill="rgba(255,255,255,0.06)" />
            <rect x="20" y="56" width="70" height="12" rx="4" fill="rgba(255,255,255,0.04)" />
            <rect x="110" y="56" width="150" height="12" rx="4" fill="rgba(255,255,255,0.04)" />
            <rect x="280" y="56" width="100" height="12" rx="4" fill="rgba(255,255,255,0.04)" />
            <rect x="395" y="56" width="55" height="12" rx="4" fill="rgba(255,255,255,0.04)" />
            <rect x="465" y="56" width="120" height="12" rx="4" fill="rgba(255,255,255,0.04)" />
            <rect x="600" y="56" width="45" height="12" rx="4" fill="rgba(255,255,255,0.04)" />
            <rect x="660" y="56" width="80" height="12" rx="4" fill="rgba(255,255,255,0.04)" />
            <rect x="755" y="56" width="160" height="12" rx="4" fill="rgba(255,255,255,0.04)" />
            <rect x="930" y="56" width="65" height="12" rx="4" fill="rgba(255,255,255,0.04)" />
            <rect x="1015" y="56" width="50" height="12" rx="4" fill="rgba(255,255,255,0.04)" />
            <rect x="1080" y="56" width="100" height="12" rx="4" fill="rgba(255,255,255,0.04)" />
            <rect x="0" y="0" width="1200" height="420" fill="url(#shimmer)" />
          </svg>
        </div>
        <table id="courseTable">
          <thead id="courseTableHead">
            <tr></tr>
          </thead>
          <tbody id="courseTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- ═══ Schedule Builder Mode ═══ -->
    <div id="scheduleMode" class="schedule-mode mode-hidden">
      <!-- Sub-mode toggle -->
      <div class="schedule-submode glass" id="scheduleSubmode">
        <nav class="submode-switch" role="tablist" aria-label="نوع برنامه‌ساز">
          <button class="submode-tab active" data-submode="manual" role="tab" aria-selected="true">دستی</button>
          <button class="submode-tab" data-submode="ai" role="tab" aria-selected="false">هوش مصنوعی</button>
        </nav>
      </div>

      <!-- Timetable -->
      <div class="timetable-wrapper glass" id="timetableWrapper">
        <div class="timetable-header">
          <h2>برنامه هفتگی</h2>
        </div>
        <div class="timetable-scroll">
          <div class="timetable" id="timetable"></div>
        </div>
      </div>

      <!-- Statistics + Selected Courses side by side -->
      <div class="schedule-info-row">
        <!-- Statistics -->
        <div class="schedule-stats glass" id="scheduleStats">
          <h3>آمار برنامه</h3>
          <div class="stats-grid" id="statsGrid"></div>
        </div>

        <!-- Selected Courses -->
        <div class="selected-courses glass" id="selectedCourses">
          <h3>دروس انتخاب شده</h3>
          <div class="selected-list" id="selectedList">
            <p class="empty-state-small">هنوز درسی اضافه نشده است</p>
          </div>
        </div>
      </div>

      <!-- AI Generator -->
      <div class="ai-generator glass mode-hidden" id="aiGenerator">
        <div class="ai-header">
          <h3>انتخاب دروس برای هوش مصنوعی</h3>
          <p class="ai-description">دروس مورد نظر خود را انتخاب کنید و برنامه بهینه دریافت کنید</p>
        </div>

        <!-- Selected courses for AI (card-based) -->
        <div class="ai-course-list" id="aiCourseList">
          <p class="ai-empty">از جدول زیر دروس مورد نظر خود را انتخاب کنید</p>
        </div>

        <!-- Goal selector -->
        <div class="ai-goal-section">
          <label for="aiGoal">هدف بهینه‌سازی:</label>
          <select id="aiGoal" class="semester-select">
            <option value="min-days">کمترین روز حضور</option>
            <option value="min-gap">کمترین فاصله بین کلاس‌ها</option>
            <option value="late-start">دیرترین شروع صبح</option>
            <option value="early-end">زودترین پایان روز</option>
            <option value="balanced">برنامه متعادل</option>
          </select>
        </div>

        <!-- Generate button -->
        <button id="btnGenerate" class="btn btn-generate">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          تولید برنامه
        </button>

        <!-- Loading -->
        <div class="ai-loading" id="aiLoading" style="display:none">
          <div class="ai-spinner"></div>
          <span>در حال تولید برنامه...</span>
        </div>

        <!-- Error -->
        <div class="ai-error" id="aiError" style="display:none"></div>

        <!-- Results -->
        <div class="ai-results" id="aiResults" style="display:none">
          <div class="ai-tabs" id="aiTabs"></div>
          <div class="ai-preview" id="aiPreview"></div>
          <button id="btnLoadSchedule" class="btn btn-load">بارگذاری در برنامه‌ساز</button>
        </div>
      </div>

      <!-- Course table -->
      <div class="schedule-course-table glass">
        <div class="schedule-table-header">
          <h2>انتخاب دروس</h2>
          <span class="schedule-course-count" id="scheduleCourseCount"></span>
        </div>
        <div class="table-wrapper" dir="rtl">
          <table id="scheduleCourseTable">
            <thead id="scheduleCourseTableHead">
              <tr></tr>
            </thead>
            <tbody id="scheduleCourseTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll to Top -->
  <button class="scroll-top" id="scrollTop" title="بازگشت به بالا">↑</button>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <script src="shared.js"></script>
  <script src="app.js"></script>
  <script src="schedule.js"></script>
</body>
</html>
