<body>
  <a href="#courseTable" class="skip-link">رفتن به جدول دروس</a>
  <div class="container">
    <!-- Header -->
    <header class="header glass">
      <div class="header-top">
        <h1 class="title">جستجوی دروس</h1>
        <div class="header-actions">
          <select class="semester-select" id="semesterSelect"></select>
          <button class="theme-toggle" id="themeToggle" title="تغییر تم">☀️</button>
          <span class="update-date" id="updateDate"></span>
          <button class="btn btn-export" id="btnPdf" title="دانلود PDF">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            PDF
          </button>
          <button class="btn btn-export" id="btnXlsx" title="دانلود XLSX">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>
            XLSX
          </button>
        </div>
      </div>
    </header>

    <!-- Category + Gender Filter (shared glass container) -->
    <div class="filter-bar glass" id="filterBar">
      <div class="category-filter" role="group" aria-label="دسته‌بندی دروس">
        <button class="cat-btn" data-cat="عمومی">عمومی</button>
        <button class="cat-btn" data-cat="تخصصی">تخصصی</button>
        <button class="cat-btn active" data-cat="همه">همه</button>
      </div>
      <div class="gender-filter" id="genderFilter" role="group" aria-label="جنسیت">
        <button class="cat-btn" data-gender="خواهران">خواهران</button>
        <button class="cat-btn" data-gender="برادران">برادران</button>
        <button class="cat-btn active" data-gender="همه">همه</button>
      </div>
    </div>

    <!-- Search Area -->
    <div class="search-area glass">
      <div class="search-fields">
        <div class="search-field">
          <label for="searchCode">کد درس</label>
          <div class="input-group">
            <input type="text" id="searchCode" placeholder="جستجو..." data-field="کد درس">
            <button class="btn-add" data-field="کد درس" title="افزودن فیلتر">+</button>
          </div>
        </div>
        <div class="search-field">
          <label for="searchName">نام درس</label>
          <div class="input-group">
            <input type="text" id="searchName" placeholder="جستجو..." data-field="نام درس">
            <button class="btn-add" data-field="نام درس" title="افزودن فیلتر">+</button>
          </div>
        </div>
        <div class="search-field">
          <label for="searchOffer">کد ارائه</label>
          <div class="input-group">
            <input type="text" id="searchOffer" placeholder="جستجو..." data-field="کد ارائه">
            <button class="btn-add" data-field="کد ارائه" title="افزودن فیلتر">+</button>
          </div>
        </div>
        <div class="search-field">
          <label for="searchInstructor">نام استاد</label>
          <div class="input-group">
            <input type="text" id="searchInstructor" placeholder="جستجو..." data-field="نام استاد">
            <button class="btn-add" data-field="نام استاد" title="افزودن فیلتر">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Active Filters -->
    <div class="active-filters" id="activeFilters"></div>

    <!-- Results Bar -->
    <div class="results-bar">
      <span class="results-count" id="resultsCount"></span>
      <button class="btn btn-clear" id="btnClear" style="display:none">پاک کردن فیلترها</button>
    </div>

    <!-- Error Banner -->
    <div class="error-banner" id="errorBanner">
      <span class="error-banner-text" id="errorBannerText"></span>
      <button class="error-banner-close" id="errorBannerClose">&times;</button>
    </div>
